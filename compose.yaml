name: events-system

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: eventspassword
      POSTGRES_DB: events_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_user -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastify:
    build:
      context: .
      dockerfile: src/server/Dockerfile.fastify.dev
    ports:
      - "3001:3001"
    env_file:
      - ./src/server/.env
    environment:
      NODE_ENV: development
      PGHOST: db
      PGPORT: "5432"
      DATABASE_URL: postgres://events_user:eventspassword@db:5432/events_db
      FASTIFY_HOST: 0.0.0.0
      FASTIFY_PORT: "3001"
      CLIENT_URL: http://localhost:3000
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/src/server/node_modules
    command: ["pnpm", "--filter", "./src/server", "run", "dev:docker"]
    depends_on:
      db:
        condition: service_healthy

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs.dev
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_DEV_API_URL: http://localhost:3001/api/trpc
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - server_node_modules:/app/src/server/node_modules
      - next_cache:/app/.next
    depends_on:
      fastify:
        condition: service_started

volumes:
  postgres_data:
  root_node_modules:
  server_node_modules:
  next_cache:
