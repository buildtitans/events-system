name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build and Package
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      artifact_key: ${{ steps.package.outputs.artifact_key }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_DEV_API_URL: http://localhost:3001/api/trpc
      NEXT_PUBLIC_PROD_API_URL: /api/trpc
      pnpm_config_node_linker: isolated
      pnpm_config_package_import_method: copy

    steps:
      - name: Prepare Amazon Linux build environment
        run: |
          dnf install -y \
            gcc-c++ \
            git \
            gzip \
            make \
            python3 \
            tar
          dnf clean all

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit development dependencies
        continue-on-error: true
        run: pnpm audit --dev --audit-level high

      - name: Create CI env files
        run: |
          cat > .env <<'EOF'
          PGHOST=127.0.0.1
          PGPORT=5432
          PGDATABASE=events_ci
          PGUSER=events_ci
          PGPASSWORD=events_ci
          PGMAX=10
          COOKIES_SECRET=ci-cookie-secret
          DEV_CLIENT_URL=http://localhost:3000
          PROD_FASTIFY_HOST=127.0.0.1
          PROD_FASTIFY_PORT=3001
          DEV_PW_RESET_URL=http://localhost:3000/reset-password
          PROD_PW_RESET_URL=https://events-system.dev/reset-password
          RESEND_API_KEY=ci_resend_key
          RESEND_DEV_API_KEY=ci_resend_dev_key
          GEOAPIFY_API_KEY=ci_geoapify_key
          GEOAPIFY_REQ_BASE_URL=https://api.geoapify.com/v1/geocode/autocomplete
          NEXT_PUBLIC_DEV_API_URL=http://localhost:3001/api/trpc
          NEXT_PUBLIC_PROD_API_URL=/api/trpc
          EOF

          sed -i 's/^          //' .env
          cp .env src/server/.env

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm exec tsc --noEmit
          pnpm --dir src/server exec tsc --noEmit -p tsconfig.json

      - name: Test
        run: pnpm test --runInBand

      - name: Build Next app
        run: pnpm build

      - name: Build Fastify server
        run: pnpm build:fastify

      - name: Package release artifact
        id: package
        run: pnpm release:package

      - name: Transfer release artifact to upload job
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_key: ${{ steps.upload.outputs.artifact_key }}

    steps:
      - name: Validate release environment
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          BT_INFRA_RELEASE_BUCKET_NAME: ${{ vars.BT_INFRA_RELEASE_BUCKET_NAME }}
        run: |
          missing=0

          for name in AWS_REGION AWS_ROLE_TO_ASSUME BT_INFRA_RELEASE_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "${name} is required in the prod environment."
              missing=1
            fi
          done

          exit "$missing"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build-and-package.outputs.artifact_name }}
          path: .deploy/artifacts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release artifact
        id: upload
        env:
          ARTIFACT_KEY: ${{ needs.build-and-package.outputs.artifact_key }}
          ARTIFACT_PATH: .deploy/artifacts/${{ needs.build-and-package.outputs.artifact_name }}
          RELEASE_BUCKET: ${{ vars.BT_INFRA_RELEASE_BUCKET_NAME }}
        run: |
          for name in ARTIFACT_KEY ARTIFACT_PATH RELEASE_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "${name} is required."
              exit 1
            fi
          done

          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "Artifact file does not exist: $ARTIFACT_PATH"
            exit 1
          fi

          case "$ARTIFACT_KEY" in
            events-system/releases/*.tgz) ;;
            *)
              echo "Artifact key must be under events-system/releases/ and end with .tgz."
              echo "Actual artifact key: $ARTIFACT_KEY"
              exit 1
              ;;
          esac

          aws s3 cp "$ARTIFACT_PATH" "s3://${RELEASE_BUCKET}/${ARTIFACT_KEY}"
          echo "artifact_key=${ARTIFACT_KEY}" >> "$GITHUB_OUTPUT"
          echo "Uploaded artifact key: ${ARTIFACT_KEY}"

  deploy-prod:
    name: Deploy through BT-Infra
    needs: upload
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write

    env:
      ARTIFACT_KEY: ${{ needs.upload.outputs.artifact_key }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BT_INFRA_INSTANCE_ID: ${{ vars.BT_INFRA_INSTANCE_ID }}
      DEPLOY_DOCUMENT_NAME: ${{ vars.EVENTS_SYSTEM_RELEASE_DEPLOY_DOCUMENT_NAME }}
      DEPLOY_ROLE_ARN: ${{ vars.EVENTS_SYSTEM_RELEASE_DEPLOY_ROLE_ARN }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          for name in \
            ARTIFACT_KEY \
            AWS_REGION \
            BT_INFRA_INSTANCE_ID \
            DEPLOY_DOCUMENT_NAME \
            DEPLOY_ROLE_ARN
          do
            if [[ -z "${!name}" ]]; then
              echo "$name is required in the prod environment." >&2
              exit 1
            fi
          done

          if [[ ! "$ARTIFACT_KEY" =~ ^events-system/releases/[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$ ]]; then
            echo "Invalid Events System artifact key: $ARTIFACT_KEY" >&2
            exit 1
          fi

      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy release
        run: |
          set -euo pipefail

          parameters="$(jq -cn \
            --arg artifact_key "$ARTIFACT_KEY" \
            '{ArtifactKey: [$artifact_key]}'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$BT_INFRA_INSTANCE_ID" \
              --document-name "$DEPLOY_DOCUMENT_NAME" \
              --parameters "$parameters" \
              --comment "events-system production release deploy" \
              --query "Command.CommandId" \
              --output text
          )"

          if [[ -z "$command_id" || "$command_id" == "None" ]]; then
            echo "SSM did not return a command ID." >&2
            exit 1
          fi

          echo "SSM command ID: $command_id"

          for attempt in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$BT_INFRA_INSTANCE_ID" \
                --query Status \
                --output text 2>/dev/null || true
            )"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$BT_INFRA_INSTANCE_ID" \
                  --output json
                exit 0
                ;;
              Cancelled|TimedOut|Failed|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$BT_INFRA_INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for release deployment." >&2
          exit 1
